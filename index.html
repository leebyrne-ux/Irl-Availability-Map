  #avail { height: 100px; resize: vertical; }

  textarea:focus, input[type="text"]:focus { outline: none; border-color: #38bdf8; }
  #loads:focus { border-color: #34d399; }

  .btn-danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.5); }
  .btn-send { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); color: #04101f; font-weight: 700; padding: 7px 12px; }
  .btn-send:hover { filter: brightness(1.08); }

  .msg { font-size: 11px; padding: 5px 9px; border-radius: 6px; display: none; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
  .sec { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
  .list { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; max-height: 155px; padding-right: 2px; }
  .card { background: #111a2e; border: 1px solid #1e293b; border-radius: 7px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: 0.15s; }
  .card:hover { border-color: #334155; }

  .card.hz { border-left: 3px solid #ef4444; background: rgba(239,68,68,0.08); }

  .card.ld.uncovered .card-title { color: #f87171 !important; text-decoration: line-through; }
  .card.ld.uncovered .card-sub { color: #fca5a5 !important; }
